[preset.0]

name="Windows Debug"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features="formal_release"
export_filter="all_resources"
include_filter="data/combat/*.json,data/world/*.json,data/dialogue/*.json,data/ui/*.json,assets/licenses/*,addons/*/LICENSE*"
exclude_filter=".work/*,docs/*,tests/*,tools/*,source_assets/*,content_packs/*,build/*,test-results/*,*/provenance/*,assets/*/source.json,assets/*/prompts.json,assets/*/manifest.json,assets/manifest.json,*.blend,*.blend1,*.psd,*.kra,*.xcf,*.aseprite,*.zip,*.7z,*.log,*.py,*.pyc"
export_path=""
patches=PackedStringArray()
script_export_mode=2
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
